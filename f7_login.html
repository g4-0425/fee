<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courgette&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#0f172a,#2563eb,#7c3aed);
            font-family:"Courgette",sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        section{
            background:#ffffff;
            width:350px;
            padding:30px;
            border-radius:12px;
            box-shadow:0 0 20px rgba(255,255,255,0.2);
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
        }


        input{
            height: 40px;
            width: 100%;
            padding:2px 10px;
            margin-bottom:18px;
            border: none;
            background:linear-gradient(135deg,#d4ddf1,#b8cdfa,#c9b0f4);
            outline:none;
            font-size:1.1rem;
            transition:0.3s;
        }


        button{
            width:100%;
            padding:12px;
            margin-bottom: 20px;
            border:none;
            border-radius:8px;
            background:linear-gradient(90deg,#2563eb,#7c3aed);
            color:white;
            font-size:1.5rem;
            font-family:"Courgette",sans-serif;
        
            transition:all 0.4s ease;
        }

        button:hover{
            cursor: pointer;
            background:#014c5e;
        
        }
        button:active{
            transform: scale(0.95);
        }


    </style>
</head>
<body>
<section>
    <main>
    <form action="#" method="get">
        <h2 style="text-align: center;">Login</h2>
        <label>Email</label>
        <input type="email" placeholder="Enter your email" minlength="3" max="8"  required>
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required><br>
        <button type="submit">Submit</button>
    </form>
</main>

</section>
</body>
</html>
